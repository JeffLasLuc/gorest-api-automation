name: CI

on:
  push:
    branches:
      - main
      - develop
      - master

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Instalar Inso CLI (Oficial)
        uses: kong/setup-inso@v1
        with:
          inso-version: 8.6.0

      - name: Injetar Token de Seguranca
        run: sed -i 's/SEU_TOKEN_AQUI/${{ secrets.GOREST_TOKEN }}/g' Testes_GoRest.json

      - name: Run tests
        run: inso run test Testes_GoRest.json --env "QA - GoRest" --ci