name: CI

on:
  push:
    branches:
      - main
      - master

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Newman
        run: npm install -g newman

      - name: Verify files exist
        run: |
          echo "Verificando arquivos necessários..."
          ls -la
          if [ ! -f "Testes_GoRest.json" ]; then
            echo "ERRO: Testes_GoRest.json não encontrado"
            exit 1
          fi
          if [ ! -f "Environment.json" ]; then
            echo "ERRO: Environment.json não encontrado"
            exit 1
          fi

      - name: Inject token into Environment.json
        run: |
          echo "Injetando token no Environment.json..."
          if [ -z "${{ secrets.GOREST_TOKEN }}" ]; then
            echo "ERRO: GOREST_TOKEN secret não está configurado"
            exit 1
          fi
          sed -i "s/token_falso_aqui/${{ secrets.GOREST_TOKEN }}/g" Environment.json
          echo "Conteúdo do Environment.json após injeção:"
          cat Environment.json

      - name: Run tests with Newman
        run: newman run Testes_GoRest.json -e Environment.json --color on --reporters cli,json