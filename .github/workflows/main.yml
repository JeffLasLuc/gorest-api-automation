name: CI

on:
  push:
    branches:
      - main
      - develop
      - master

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Instalar Inso CLI (Oficial)
        uses: kong/setup-inso@v1
        with:
          inso-version: 8.6.0

      - name: Import collection
        run: inso import APITest_GoRest.json

      - name: List test suites
        run: inso list test suites

      - name: Run tests
        env:
          base_url: https://gorest.co.in/public/v2
          token: ${{ secrets.GOREST_TOKEN }}
        run: inso run test "Testes GoRest" --ci