$kind: http-request
url: "{{base_url}}/users/{{user_id}}"
method: DELETE
auth:
  type: bearer
  credentials:
    token: "{{token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code deve ser 200 OK", function () {
          pm.response.to.have.status(200);
      });
    language: text/javascript
order: 5000
