$kind: http-request
url: "{{base_url}}/users"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "{{$randomFullName}}",
      "gender": "male",
      "email": "{{$randomEmail}}",
      "status": "inválido"
    }
auth:
  type: bearer
  credentials:
    token: "{{token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code deve ser 422 Unprocessable Entity", function () {
          pm.response.to.have.status(422);
      });
      const resposta = pm.response.json();
      pm.test("A API deve apontar erro no campo status", function () {
          pm.expect(resposta[0].field).to.equal("status");
      });
    language: text/javascript
order: 4000
